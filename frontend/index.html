<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>She Can Foundation</title>

  <!-- CSS -->

  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <!-- =========================
       Background Circles
  ========================== -->

  <div class="bg-circle one"></div>

  <div class="bg-circle two"></div>

  <!-- =========================
       Navbar
  ========================== -->

  <nav class="navbar">

    <!-- Logo -->

    <div class="logo">

      <div class="logo-icon">

        ✨

      </div>

      <div class="logo-text">

        <h2>She Can Foundation</h2>

        <span>
          Empowering Women
        </span>

      </div>

    </div>

    <!-- Dark Mode Button -->

    <button id="themeBtn">

      🌙

    </button>

  </nav>

  <!-- =========================
       Main Section
  ========================== -->

  <section class="main-section">

    <!-- Left Content -->

    <div class="content">

      <h1>

        Empowering Women Through Technology

      </h1>

      <p>

        Join us in creating opportunities,
        building confidence, and transforming
        futures through innovation and education.

      </p>

    </div>

    <!-- =========================
         Form Card
    ========================== -->

    <div class="form-card">

      <h2>Contact Us</h2>

      <!-- Form -->

      <form id="contactForm">

  <div class="input-box">
    <input type="text" id="name" required>
    <label>Name</label>
  </div>

  <div class="input-box">
    <input type="email" id="email" required>
    <label>Email</label>
  </div>

  <div class="input-box">
    <textarea id="message" required></textarea>
    <label>Message</label>
  </div>

  <!-- IMPORTANT: type="submit" -->
  <button type="submit" id="submitBtn">
    Send Message
  </button>

  <p id="successMessage"></p>

</form>

    </div>

  </section>

  <!-- =========================
       Toast Notification
  ========================== -->

  <div id="toast"></div>

  <!-- JavaScript -->

  <script src="script.js"></script>

</body>

</html>

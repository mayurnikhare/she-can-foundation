<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login</title>

  <!-- CSS -->

  <link rel="stylesheet" href="login.css">

  <!-- Google Fonts -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <!-- =========================
       Background Shapes
  ========================== -->

  <div class="bg-circle one"></div>

  <div class="bg-circle two"></div>

  <!-- =========================
       Login Container
  ========================== -->

  <div class="login-container">

    <!-- Login Box -->

    <div class="login-box">

      <h1>Admin Login</h1>

      <p>
        Secure access to dashboard
      </p>

      <!-- Login Form -->

      <form id="loginForm">

        <!-- Username -->

        <div class="input-box">

          <input
            type="text"
            id="username"
            required
          >

          <label>
            Username
          </label>

        </div>

        <!-- Password -->

        <div class="input-box">

          <input
            type="password"
            id="password"
            required
          >

          <label>
            Password
          </label>

        </div>

        <!-- Login Button -->

        <button
          type="submit"
          id="loginBtn"
        >

          Login

        </button>

        <!-- Error Message -->

        <p id="errorMessage"></p>

      </form>

    </div>

  </div>

  <!-- JavaScript -->

  <script src="login.js"></script>

</body>

</html>
